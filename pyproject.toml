# Pyproject used for the docker implementation of the Android World Environment
# only. The non-docker implementation uses a requirements.txt file.

[build-system]
requires = ["setuptools>=61.0,<81", "grpcio-tools==1.71.0"]
build-backend = "setuptools.build_meta"

[project]
name = "android_world"
version = "0.1.0"
description = "Android World Environment Project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "absl-py==2.1.0",
    "android_env==1.2.3",
    "dm_env==1.6",
    "fuzzywuzzy==0.18.0",
    "google-generativeai",
    "grpcio-tools==1.71.0",
    "protobuf==5.29.5",
    "immutabledict==2.0.0",
    "IPython",
    "jsonschema==4.17.3",
    "numpy==1.26.3",
    "opencv-python",
    "pandas==2.1.4",
    "pillow==12.1.1",
    "pydub",
    "python-Levenshtein",
    "pytest",
    "requests",
    "tenacity",
    "termcolor",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

# NOTE: Do NOT use automatic package discovery here.
# The Dockerfile does `WORKDIR /` + `COPY . /`, so the project root inside the
# image is `/`. Automatic discovery makes setuptools os.walk() the ENTIRE
# container filesystem (with followlinks=True), which recurses infinitely into
# `/proc/self/task/*/cwd` (a procfs symlink pointing back to `/`) and the build
# hangs at 100% CPU forever. List the packages explicitly instead.
[tool.setuptools]
packages = [
    "android_world",
    "android_world.agents",
    "android_world.env",
    "android_world.env.setup_device",
    "android_world.task_evals",
    "android_world.task_evals.common_validators",
    "android_world.task_evals.composite",
    "android_world.task_evals.information_retrieval",
    "android_world.task_evals.information_retrieval.proto",
    "android_world.task_evals.miniwob",
    "android_world.task_evals.robustness_study",
    "android_world.task_evals.single",
    "android_world.task_evals.single.calendar",
    "android_world.task_evals.utils",
    "android_world.utils",
]

[tool.setuptools.package-data]
"*" = ["*.json", "*.proto", "*.textproto", "*.xml", "res/xml/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py","*_test.py"]